# Les douze invariants, à chaque poussée. Sans ça ils ne gardent rien : ils ne tournent
# que quand quelqu'un pense à les lancer, c'est-à-dire jamais au moment où ça compte.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # build + les invariants du site + le contrôle du schéma
      - run: npm run check
