# Garde principal : les douze invariants du site tiennent-ils encore ? Sans ce workflow ils
# ne tournent que quand quelqu'un pense à les lancer, c'est-à-dire jamais au moment où ça
# compte. C'est le seul workflow qu'il est raisonnable de rendre obligatoire sur `main`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un commit plus récent sur la même branche rend un run en vol sans objet.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build et invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7


      # Le dépôt qui fait foi sur le schéma. `check-schema.mjs` compare les clés, les
      # domaines et les bornes à ses sources ; sans ce checkout il sautait la comparaison
      # et n'affirmait plus rien. Branche par défaut à dessein : une dérive du validateur
      # doit se voir ici, pas six mois plus tard.
      - name: Checkout du toolkit (source de vérité du schéma)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Reefact/conventional-comments-toolkit
          path: toolkit

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # build + les invariants du site + le schéma comparé au toolkit
      - run: npm run check
        env:
          TOOLKIT_PATH: ./toolkit
