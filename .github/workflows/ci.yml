# Garde principal : les douze invariants du site tiennent-ils encore ? Sans ce workflow ils
# ne tournent que quand quelqu'un pense à les lancer, c'est-à-dire jamais au moment où ça
# compte. C'est le seul workflow qu'il est raisonnable de rendre obligatoire sur `main`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un commit plus récent sur la même branche rend un run en vol sans objet.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build et invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7


      # Le dépôt qui fait foi sur le schéma. `check-schema.mjs` compare les clés, les
      # domaines et les bornes à ses sources ; sans ce checkout il sautait la comparaison
      # et n'affirmait plus rien. Branche par défaut à dessein : une dérive du validateur
      # doit se voir ici, pas six mois plus tard.
      - name: Checkout du toolkit (source de vérité du schéma)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Reefact/conventional-comments-toolkit
          path: toolkit

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Blocking: build + the site invariants + the schema compared with the toolkit
      # + labels + release-notes pairing. `check:toolkit` is deliberately not in here.
      - run: npm run check:ci
        env:
          TOOLKIT_PATH: ./toolkit

      # Not blocking: it compares the release-notes pages with the toolkit's live default
      # branch, so it turns red on every open pull request the moment the toolkit
      # publishes a version, whatever the pull request changes. The drift is reported as
      # a warning annotation instead; `npm run check` (and so `npm run deploy`) still
      # fails on it, so a release cannot go out while the pages are behind.
      - name: Release notes against the toolkit (warning only)
        run: npm run check:toolkit || echo "::warning title=check:toolkit::Release-notes pages are out of sync with the toolkit; see this step's log."
        env:
          TOOLKIT_PATH: ./toolkit
