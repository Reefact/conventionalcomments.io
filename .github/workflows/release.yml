# Mise en ligne, sur tag `release/*` et rien d'autre.
#
# Pas sur chaque poussée de `main` : le tag EST la décision de publier, et c'est déjà la
# convention des autres dépôts. Il vaut aussi pour le site lui-même — `/version` lit
# `git describe --tags --match 'release/*'`, donc un déploiement hors tag s'annoncerait
# « pas une release » sur sa propre page.
#
# VÉRIFIER PUIS PUBLIER L'ARTEFACT VÉRIFIÉ : `npm run check` construit `dist/` et le
# contrôle, `wrangler deploy` téléverse ce même `dist/` sans rien reconstruire. Un job
# unique suffit ici — rien ne s'intercale entre le contrôle et la publication. Le jour où
# des tests navigateur s'ajoutent, il faudra les séparer et passer l'artefact d'un job à
# l'autre, comme justdummies.io le fait.
name: Release (mise en ligne)

on:
  push:
    tags: ['release/*']
  # Répétition à blanc, et rien de plus : l'étape de publication est conditionnée au tag
  # ci-dessous, donc ce chemin vérifie et s'arrête à `--dry-run`. Il servait à déployer
  # l'état courant, ce qui contredisait la règle même que ce fichier pose — et produisait
  # au passage un `/version` annonçant « pas une release ».
  workflow_dispatch:

# Deux publications simultanées sur le même nom d'hôte n'ont pas de sens, et la seconde
# gagnerait sans qu'on sache laquelle. On ne coupe pas celle qui est en vol.
concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Un tag de release nomme quelque chose qui va réellement être publié. Ce job passe AVANT
  # le build : un tag qui échoue ici bloque la release, plutôt que d'être nettoyé après coup.
  # Le détail des trois contrôles — tag annoté, message qui répète son nom, commit qui est
  # celui de la fusion de « ci: prepare <tag> » — est dans le script.
  # La condition est portée par les ÉTAPES, pas par le job : un job sauté rend sauté tout ce
  # qui en dépend, et `release` en dépend. Hors tag, ce job tourne donc à vide et réussit.
  verify-tag:
    name: Le tag nomme ce qu'il pointe
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: startsWith(github.ref, 'refs/tags/release/')
        with:
          fetch-depth: 0
      - name: Contrôler le tag
        if: startsWith(github.ref, 'refs/tags/release/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-release-tag.sh "${GITHUB_REF_NAME}"

      # Les notes sont extraites ICI, avant que quoi que ce soit ne parte. Elles ne
      # servaient qu'au job `notes`, qui vient après le déploiement : une PR
      # « ci: prepare <tag> » au bon titre mais sans la section correspondante passait
      # `verify-tag`, passait `npm run check`, déployait le site — et n'échouait qu'après,
      # sur une release déjà en ligne. La promesse écrite est qu'une release sans notes
      # ne sort pas ; elle est tenue à partir d'ici. La publication de la page GitHub
      # reste après le déploiement, elle : elle annonce, elle ne décide pas.
      - name: Les notes de cette release existent
        if: startsWith(github.ref, 'refs/tags/release/')
        run: ./scripts/release-notes.sh "${GITHUB_REF_NAME}" > /dev/null

  release:
    name: Vérifier, puis publier sur Cloudflare
    # Sur un tag, rien ne part avant que le tag lui-même ait été jugé bon.
    needs: [verify-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `/version` lit `git describe --tags`. Un clone superficiel n'a pas les tags :
          # la page annoncerait « pas une release » sur une release.
          fetch-depth: 0


      # Le dépôt qui fait foi sur le schéma. `check-schema.mjs` compare les clés, les
      # domaines et les bornes à ses sources ; sans ce checkout il sautait la comparaison
      # et n'affirmait plus rien. Branche par défaut à dessein : une dérive du validateur
      # doit se voir ici, pas six mois plus tard.
      - name: Checkout du toolkit (source de vérité du schéma)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Reefact/conventional-comments-toolkit
          path: toolkit

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Vérifier (construit dist/ et le contrôle)
        run: npm run check
        env:
          TOOLKIT_PATH: ./toolkit

      # Le tag EST la décision de publier. Sans cette garde, un déclenchement manuel
      # traversait `wrangler deploy` avec les secrets de production sur n'importe quel ref.
      - name: Publier dist/ tel quel
        if: startsWith(github.ref, 'refs/tags/release/')
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Un site qui refuse les tiers dans le navigateur n'en appelle pas depuis sa CI.
          WRANGLER_SEND_METRICS: false

      # Hors tag : on va jusqu'au bout de ce qui ne publie rien. Une erreur de
      # configuration se voit alors ici plutôt qu'au moment de poser le tag.
      - name: Répétition à blanc (hors tag release/*)
        if: ${{ !startsWith(github.ref, 'refs/tags/release/') }}
        run: npx wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: false

  # Ce que la release a changé, lu tel quel dans RELEASE_NOTES-en.md — écrit et relu AVANT
  # que le tag ne soit posé. Rien n'est dérivé de `git log` : un sujet de commit explique un
  # diff à un relecteur, pas une version à quelqu'un qui décide s'il va regarder ce qui est
  # nouveau. `scripts/release-notes.sh` refuse plutôt que de produire un pis-aller, donc une
  # release sans notes échoue ici — bruyamment, et après le déploiement, qui lui est déjà
  # parti et n'a pas à en souffrir.
  notes:
    name: Notes de version
    needs: release
    if: startsWith(github.ref, 'refs/tags/release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Publier la Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          # Rejouable : un tag peut arriver ici deux fois — le dialogue « Run workflow »
          # liste les tags, et redéployer une release est une chose légitime. Une seconde
          # tentative ne doit pas faire échouer le pipeline sur une page qui existe déjà.
          if gh release view "${tag}" > /dev/null 2>&1; then
            echo "::notice title=Release déjà présente::${tag} a déjà sa page ; laissée telle quelle."
            exit 0
          fi

          # Le sujet du tag annoté. Le repli sur le nom du tag est une ceinture à cette
          # bretelle, pas un second titre : ce qui dit POURQUOI la release existe, c'est
          # RELEASE_NOTES-en.md ci-dessous.
          title="$(git for-each-ref "refs/tags/${tag}" --format='%(contents:subject)')"

          ./scripts/release-notes.sh "${tag}" > release-notes.md

          gh release create "${tag}" \
            --title "${title:-${tag}}" \
            --notes-file release-notes.md \
            --latest
