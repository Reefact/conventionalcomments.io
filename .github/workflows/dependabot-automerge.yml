name: dependabot-automerge

# The low-friction lane of the Dependabot automation policy: for Dependabot PRs, enable
# GitHub auto-merge on patch and minor updates so they merge on their own once
# the required checks pass. Major updates are deliberately left untouched for
# human review.
#
# IMPORTANT — this workflow only *enables* auto-merge; it does not decide when to
# merge. GitHub merges the PR only once the branch's REQUIRED status checks pass.
# Without a rule on `main` that marks the CI checks as required, auto-merge would
# merge immediately. The required checks are therefore the safety gate, not this
# workflow — which is why the `gate` step below reads the ruleset and refuses to arm
# while that gate does not exist. Stating the assumption in a comment was not enough:
# a review found `main` carrying no required check at all, so this file would have
# armed auto-merge on a branch where "auto" meant "now".
#
# Why the job keys on the pull request's AUTHOR and not on `github.actor`. Auto-merge,
# once enabled, SURVIVES later pushes to the head branch. `github.actor` names whoever
# triggered the run, so a push by someone else made the job skip — leaving the
# auto-merge armed on a tip that nobody re-checked. The author of a pull request never
# changes, so keying on it means this job runs on EVERY event of a Dependabot pull
# request, including a push by someone else, which is precisely when it needs to act.
#
# Identity is then settled twice, and the two answers do different work:
#   - `dependabot/fetch-metadata` re-checks the pull request's author and the FIRST
#     commit's signature. It fails closed — no outputs, so the steps below are
#     skipped.
#   - The TIP check here is the one the action does not do. `fetch-metadata` validates
#     the first commit; auto-merge acts on the tip. Somebody with push access can append
#     to a Dependabot branch without changing either the author or the first commit.
#
# The tip is sorted into exactly TWO states, and there is deliberately no third:
#   - `dependabot-signed` — the tuple matches one GitHub itself produces for Dependabot.
#     Only this state ARMS auto-merge.
#   - `foreign` — everything else, including a tip this job could not read. This state
#     WITHDRAWS auto-merge.
# An earlier version kept a middle state for "authored by Dependabot but not signed",
# which left whatever was already armed alone. A review showed that bucket is reachable
# by the attacker it was meant to stop: commit author names forge freely, so anyone with
# push access could park a tip there and keep an armed auto-merge from being withdrawn.
# Anything not positively recognised is now foreign, and withdrawing is the fail-safe
# direction — at worst a human merges by hand.

on:
  pull_request:
    branches:
      - main

# Least privilege by default; the job widens only what it needs.
permissions:
  contents: read

jobs:
  automerge:
    name: Auto-merge Dependabot patch/minor
    runs-on: ubuntu-latest
    # Fetch metadata + enable auto-merge is seconds; cap a stuck runner.
    timeout-minutes: 10
    # Only act on pull requests Dependabot OPENED — a fact no later push can change.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      # Enable auto-merge (contents) on the pull request (pull-requests).
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3

      - name: Inspect the head commit this event is about
        id: tip
        # Reads the tip the checks actually ran against, not whatever the branch points at
        # by the time this job runs. A newer push raises its own event and re-enters here.
        # Fail closed: anything unreadable answers "not Dependabot's", which only ever
        # withholds or withdraws auto-merge.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # `.author` and `.committer` are the GitHub ACCOUNTS resolved from the commit's
          # author and committer e-mail addresses — not the free-text names in the commit
          # object. `.commit.verification.verified` attests the signature over the whole
          # commit. All three are read in one call so they describe one object.
          tip="$(gh api "repos/${GH_REPO}/commits/${HEAD_SHA}" \
            --jq '"\(.author.login // "")|\(.committer.login // "")|\(.commit.verification.verified)"' 2>/dev/null || true)"
          echo "head ${HEAD_SHA}: ${tip:-unreadable}"
          # Dependabot does not commit — it asks GitHub to, and GitHub signs with its own
          # key. So the AUTHOR is Dependabot while the COMMITTER is GitHub's own identity,
          # `noreply@github.com`, which resolves to the `web-flow` account. Requiring
          # Dependabot on both sides therefore rejects every genuine tip; a review caught
          # exactly that, citing Reefact/justdummies.io#180, whose head 55f81ca reads
          # author=dependabot[bot], committer=web-flow, verified=true.
          #
          # `verified` is the load-bearing field: forging either NAME is free, but a commit
          # GitHub reports as verified was signed by a key GitHub holds. The committer list
          # then says WHICH GitHub-held identity is acceptable, so a tip signed with some
          # contributor's own verified key — author forged to dependabot[bot], committer
          # themselves — fails to match and is treated as foreign.
          #
          # String equality, not `case`: in a shell pattern the brackets of "[bot]" are a
          # character class, so `case` would match "dependabott" and not the literal name.
          if [ "$tip" = "dependabot[bot]|web-flow|true" ] \
            || [ "$tip" = "dependabot[bot]|dependabot[bot]|true" ]; then
            echo "state=dependabot-signed" >> "$GITHUB_OUTPUT"
          else
            # Unrecognised, or unreadable. Fail closed in the safe direction.
            echo "state=foreign" >> "$GITHUB_OUTPUT"
          fi

      # The guard rail this workflow ASSUMES. `gh pr merge --auto` does not decide when to
      # merge: GitHub merges as soon as the REQUIRED checks pass. If the branch requires
      # none, "as soon as" means immediately, and a Dependabot pull request lands before
      # CI, lint, dependency-review and codeql have said anything. The comment at the head
      # of this file already says so — it assumed the rule rather than checking it.
      #
      # So the workflow verifies its own precondition and fails closed: unless main
      # requires EVERY check below, it does not arm, and says which ones are missing. It
      # arms itself the day the ruleset carries them all.
      #
      # Counting was not enough. A review pointed out that a non-zero count is satisfied by
      # a single required check, so a ruleset holding one — or one that later drifts and
      # loses four — would arm auto-merge while the other four were still running or
      # already failing. The names are therefore compared as a set.
      - name: Are the required status checks configured on main?
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Every check that must be required on main before auto-merge may arm, one per
          # line. Each string is a job's `name:`, which is what GitHub uses as the status
          # check context — so renaming a job means renaming it here too, and until then
          # this gate withholds rather than arming on a check that no longer reports.
          EXPECTED: |
            Build et invariants
            Conventional commits
            Lint scripts and workflows
            CodeQL analyze (javascript-typescript)
            Dependency review
        run: |
          set -uo pipefail
          # The contexts main actually requires, one per line. Unreadable answers the same
          # as empty, which withholds.
          required="$(gh api "repos/${GH_REPO}/rules/branches/main" \
            --jq '.[] | select(.type == "required_status_checks")
                      | .parameters.required_status_checks[]?.context' 2>/dev/null || true)"
          echo "main requires: ${required:-(none)}"
          # A herestring, not a pipe: a piped `while` runs in a subshell and would lose
          # `missing`. `grep -qxF` matches the whole line literally, so the parentheses in
          # "CodeQL analyze (javascript-typescript)" stay parentheses.
          missing=""
          while IFS= read -r want; do
            [ -n "${want}" ] || continue
            if ! printf '%s\n' "${required}" | grep -qxF -- "${want}"; then
              echo "  MISSING: ${want}"
              missing="${missing}${want}; "
            fi
          done <<< "${EXPECTED}"
          # A superset is fine — extra required checks only ever delay a merge.
          if [ -z "${missing}" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::notice title=Auto-merge withheld::main does not require: ${missing}Auto-merge would let a Dependabot pull request merge while those run, or fail. Add them to the ruleset; this workflow arms itself once they are all there."
          fi

      - name: Enable auto-merge for patch and minor updates
        # Major updates fall through this condition, so they never get auto-merge
        # and stay open for a human to review.
        if: >-
          steps.gate.outputs.ready == 'yes' &&
          steps.tip.outputs.state == 'dependabot-signed' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --rebase "$PR_URL"

      - name: Withdraw auto-merge from a foreign head
        # The step that closes the gap: auto-merge armed on Dependabot's own commit stays
        # armed across later pushes, so a commit appended by someone with push access would
        # ride an approval it never got. Withdrawing is idempotent — `|| true` because the
        # call errors when auto-merge was not enabled in the first place, which is the
        # ordinary case here.
        #
        # `foreign` now also covers a tip that is merely unrecognised or unreadable, so a
        # transient API failure withdraws rather than leaves an armed pull request behind.
        if: steps.tip.outputs.state == 'foreign'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "Head is not Dependabot's commit; withdrawing auto-merge so a human decides."
          gh pr merge --disable-auto "$PR_URL" || true
