<!-- La source de public/apple-touch-icon.png. Boîte de 64 pour un dessin de 48 :
     8 d'air de chaque côté, soit 75 % d'emprise. Sans cette marge, le masque
     arrondi d'iOS rogne la pastille de validation, qui touchait le coin.
     Fond opaque parce qu'un PNG transparent se pose sur le fond d'écran du
     visiteur : la bulle sombre disparaîtrait sur un fond sombre. -->
